[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperion-model"
version = "0.1.0"
description = "Private model-candidate, evaluation, and QLoRA-SFT harness for Hyperion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
auth = [
    "cryptography>=48,<49",
]
promote = [
    "cryptography>=48,<49",
]
train = [
    "accelerate>=1.2,<2",
    "bitsandbytes>=0.45,<1",
    "cryptography>=48,<49",
    "datasets>=3.2,<5",
    "peft>=0.14,<1",
    "torch>=2.5,<3",
    "transformers>=4.48,<5",
    "trl>=0.15,<1",
]

[project.scripts]
hyperion = "vibe_quant_model.cli:main"
hyperion-model = "vibe_quant_model.cli:main"
vibe-quant-model = "vibe_quant_model.cli:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vibe_quant_model*"]
